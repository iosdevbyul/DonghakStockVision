name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: [self-hosted, macOS, X64]
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
      # setup-python's macOS toolcache installer assumes /Users/runner and
      # cannot write there on a personal self-hosted macOS account.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Set up Python
        run: |
          uv python install "${{ matrix.python-version }}"
          uv venv --seed --python "${{ matrix.python-version }}" "$RUNNER_TEMP/dsv-ci-venv"
          echo "$RUNNER_TEMP/dsv-ci-venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: python -m pip install -e '.[dev,learning,api,custody]'
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Mypy
        run: mypy
      - name: Offline tests
        run: pytest
      - name: Build
        run: python -m build
      - name: Installed wheel smoke test
        run: |
          echo "DSV_WHEEL_VENV=$RUNNER_TEMP/dsv-wheel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          uv venv --seed --python "$(command -v python)" "$RUNNER_TEMP/dsv-wheel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$RUNNER_TEMP/dsv-wheel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/python" -m pip install dist/*.whl
          cd /tmp
          "$DSV_WHEEL_VENV/bin/dsv" --db /tmp/smoke.sqlite3 collect --provider fake --tickers 005930 --start 2024-01-02 --end 2024-01-08
          "$DSV_WHEEL_VENV/bin/dsv" --db /tmp/smoke.sqlite3 validate
          PYTHONPATH="$GITHUB_WORKSPACE" "$DSV_WHEEL_VENV/bin/python" "$GITHUB_WORKSPACE/tests/strategy/wheel_smoke.py"
      - name: Installed learning wheel smoke test
        run: |
          for wheel in "$GITHUB_WORKSPACE"/dist/*.whl; do
            "$DSV_WHEEL_VENV/bin/python" -m pip install "$wheel[learning]"
          done
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE" "$DSV_WHEEL_VENV/bin/python" "$GITHUB_WORKSPACE/tests/learning/wheel_smoke.py"
      - name: Installed API wheel smoke test
        run: |
          for wheel in "$GITHUB_WORKSPACE"/dist/*.whl; do
            "$DSV_WHEEL_VENV/bin/python" -m pip install "$wheel[api]"
          done
          "$DSV_WHEEL_VENV/bin/python" - <<'PY'
          from fastapi.testclient import TestClient
          from donghak_stock_vision.api import create_app

          response = TestClient(create_app()).get("/api/v1/health")
          assert response.status_code == 200
          assert response.json()["mode"] == "read_only"
          PY
      - name: Installed decision wheel integration smoke test
        run: |
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE" "$DSV_WHEEL_VENV/bin/python" "$GITHUB_WORKSPACE/tests/strategy/wheel_smoke.py" --learning
